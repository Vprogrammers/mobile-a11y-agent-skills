name: Sync canonical distribution

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out light repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: light
      - name: Check out canonical repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Vprogrammers/mobile-a11y-agent-skills
          ref: main
          path: source
      - name: Generate and validate distribution
        run: |
          python3 source/scripts/build_light_distribution.py generated
          python3 source/scripts/validate_light_distribution.py generated
      - name: Replace generated content
        run: |
          find light -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R generated/. light/
      - name: Commit changes as repository owner
        working-directory: light
        run: |
          if git diff --quiet --exit-code && [ -z "$(git status --porcelain)" ]; then
            echo "Light distribution is already current."
            exit 0
          fi
          git config user.name "Viktor Nesic"
          git config user.email "16168442+vikktorn@users.noreply.github.com"
          git add --all
          git commit -m "Sync canonical accessibility agents and skills"
          git push origin HEAD:main
