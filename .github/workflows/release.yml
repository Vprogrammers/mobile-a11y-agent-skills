name: Release plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate repository
        run: ./scripts/validate.sh && python3 -m unittest discover -s tests -v
      - name: Verify tag matches plugin version
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Create source archive
        run: git archive --format=tar.gz --output="mobile-a11y-agent-skills-${GITHUB_REF_NAME}.tar.gz" HEAD
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "mobile-a11y-agent-skills-${GITHUB_REF_NAME}.tar.gz" --generate-notes
