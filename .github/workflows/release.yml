name: Release plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate structure, links, scripts, and tests
        run: ./scripts/validate.sh
      - name: Verify tag matches plugin version
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

  android-samples:
    name: Android samples and eval fixtures
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew --console=plain assembleDebug testDebugUnitTest

  ios-samples:
    name: iOS samples and eval fixtures
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./samples/ios/test.sh

  release:
    needs: [validate, android-samples, ios-samples]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create source archive
        run: git archive --format=tar.gz --output="mobile-a11y-agent-skills-${GITHUB_REF_NAME}.tar.gz" HEAD
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "mobile-a11y-agent-skills-${GITHUB_REF_NAME}.tar.gz" --generate-notes
