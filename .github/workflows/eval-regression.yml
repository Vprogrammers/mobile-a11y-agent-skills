name: Agent eval regression

# Paid model evals run only on demand; there is no schedule.
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Also run the custom suite without the plugin
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check model-eval credentials
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: |
          echo "## Model evals not executed" >> "$GITHUB_STEP_SUMMARY"
          echo "CLAUDE_CODE_OAUTH_TOKEN is not configured." >> "$GITHUB_STEP_SUMMARY"
          echo "The run completed without paid model evals."
      - name: Install pinned Claude Code
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code@2.1.310
      - name: Run blind agent and judge evals
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        env:
          EVAL_AGENT_COMMAND: >-
            claude -p --model sonnet --plugin-dir "{plugin_dir}"
            --agent mobile-a11y-agent-skills:{agent}
            --restricted --add-dir "{plugin_dir}/skills" --allowedTools Read Glob Grep Skill
            --permission-mode dontAsk --permission-prompts none
            --no-session-persistence --max-turns 8 --max-budget-usd 0.75
          EVAL_JUDGE_COMMAND: >-
            claude -p --model opus --restricted
            --permission-mode dontAsk --permission-prompts none
            --no-session-persistence --max-turns 2 --max-budget-usd 0.25
          EVAL_MODEL: agent=sonnet,judge=opus
        run: ./scripts/run_eval_suite.py evals/results/ci
      - name: Run baseline agent and judge evals
        if: env.CLAUDE_CODE_OAUTH_TOKEN != '' && inputs.baseline
        env:
          EVAL_VARIANT: baseline
          EVAL_AGENT_COMMAND: >-
            claude -p --model sonnet --restricted --allowedTools Read Glob Grep
            --permission-mode dontAsk --permission-prompts none
            --no-session-persistence --max-turns 8 --max-budget-usd 0.75
          EVAL_JUDGE_COMMAND: >-
            claude -p --model opus --restricted
            --permission-mode dontAsk --permission-prompts none
            --no-session-persistence --max-turns 2 --max-budget-usd 0.25
          EVAL_MODEL: agent=sonnet,judge=opus
        run: ./scripts/run_eval_suite.py evals/results/ci-baseline
      - name: Run official plugin eval smoke suite
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: >-
          claude plugin eval . --runs 1 --ablation with-without
          --max-cost-usd 10.00 --no-publish --trust-plugin
      - name: Upload eval evidence
        if: always() && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-eval-${{ github.sha }}
          path: |
            evals/results/ci
            evals/results/ci-baseline
            plugin-evals/results
          if-no-files-found: error
          retention-days: 30
