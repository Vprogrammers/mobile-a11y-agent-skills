name: Validate skills

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate skill structure and links
        run: ./scripts/validate.sh
      - name: Compile repository scripts
        run: python3 -m py_compile scripts/*.py
      - name: Smoke-test plugin installation layout
        run: python3 scripts/install_smoke.py .
      - name: Run validator and scorer tests
        run: python3 -m unittest discover -s tests -v
      - name: Check external references on schedule
        if: github.event_name == 'schedule'
        env:
          CHECK_EXTERNAL_LINKS: "1"
        run: ./scripts/validate.sh
