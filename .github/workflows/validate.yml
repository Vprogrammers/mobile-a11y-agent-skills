name: Validate skills

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate structure, links, scripts, and tests
        run: ./scripts/validate.sh
      - name: Install pinned Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.310
      - name: Validate Claude plugin manifest
        run: claude plugin validate --strict .
      - name: Check external references on schedule
        if: github.event_name == 'schedule'
        env:
          CHECK_EXTERNAL_LINKS: "1"
        run: python3 scripts/validate_repo.py .

  android-samples:
    name: Android samples and eval fixtures
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew --console=plain assembleDebug testDebugUnitTest
      - name: Check repair eval tests against the original fixture and the reference fix
        working-directory: .
        run: python3 scripts/run_repair_eval.py --self-check --platform=android

  kmp-samples:
    name: KMP shared contract and native adapters
    if: github.event_name != 'schedule'
    # macOS links the iOS framework and runs the simulator tests; the runner image also provides the Android SDK.
    runs-on: macos-15
    defaults:
      run:
        working-directory: samples/kmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew --console=plain check

  ios-samples:
    name: iOS samples and eval fixtures
    if: github.event_name != 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./samples/ios/test.sh
      - name: Check iOS repair eval tests against the original fixture and the reference fix
        run: python3 scripts/run_repair_eval.py --self-check --platform=ios
      - name: Upload failing XCTest result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-xcresult-${{ github.sha }}
          path: samples/ios/build/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 14
