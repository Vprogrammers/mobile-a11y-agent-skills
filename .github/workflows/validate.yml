name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill structure and links
        run: ./scripts/validate.sh
      - name: Compile validation script
        run: python3 -m py_compile scripts/validate_repo.py
