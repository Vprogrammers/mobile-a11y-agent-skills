version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
  # samples/ios has no package dependencies, so there is no swift entry.
  - package-ecosystem: gradle
    directory: "/samples/android"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
  - package-ecosystem: gradle
    directory: "/samples/kmp"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
