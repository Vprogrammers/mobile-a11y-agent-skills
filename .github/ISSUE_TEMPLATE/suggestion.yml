name: Suggestion
description: Propose a new pattern, agent behavior, eval, or improvement.
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: Every suggestion is welcome, including half-formed ideas. For open-ended questions, Discussions may fit better.
  - type: textarea
    id: idea
    attributes:
      label: Suggestion
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Who it helps and why
      description: The users, assistive technologies, platforms, or workflows it affects.
